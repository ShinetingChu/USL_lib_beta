[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra-stable-laser"
version = "0.1.0"
authors = [{ name = "zxq", email = "zxq985160104@163.com" }]
description = "超稳激光系统数据分析工具箱 - Data analysis toolbox for ultra-stable laser systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "allantools>=2024.4",
    "sympy",
]

[project.urls]
"Repository" = "https://github.com/ShinetingChu/USL_lib_beta"
"PyPI" = "https://pypi.org/project/ultra-stable-laser/"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultra_stable_laser*"]
